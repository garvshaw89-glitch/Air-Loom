<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cyberBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cubeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for Glow FX -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatIso {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }

      @keyframes streamFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes spinOrb {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .floating-cube {
        animation: floatIso 6s ease-in-out infinite;
        transform-origin: 920px 210px;
      }

      .pulse-item {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .streaming-line {
        stroke-dasharray: 12, 12;
        animation: streamFlow 2s linear infinite;
      }

      .streaming-line-fast {
        stroke-dasharray: 8, 8;
        animation: streamFlow 1.2s linear infinite reverse;
      }

      .spinning-ring {
        animation: spinOrb 16s linear infinite;
        transform-origin: 920px 210px;
      }

      .spinning-ring-reverse {
        animation: spinOrb 24s linear infinite reverse;
        transform-origin: 920px 210px;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Isometric Cyber Grid Floor -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="0.75">
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="310" x2="1200" y2="310" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="410" x2="1200" y2="410" />
    <!-- Diagonal isometric lines -->
    <path d="M 0,380 L 800,20 M 100,420 L 900,20 M 200,420 L 1000,20 M 300,420 L 1100,20 M 400,420 L 1200,20 M 500,420 L 1200,70 M 600,420 L 1200,120" />
    <path d="M 1200,380 L 400,20 M 1100,420 L 300,20 M 1000,420 L 200,20 M 900,420 L 100,20 M 800,420 L 0,20 M 700,420 L 0,70 M 600,420 L 0,120" />
  </g>

  <!-- Glowing Ambient Aura behind 3D Object -->
  <circle cx="920" cy="210" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="920" cy="210" r="90" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 70)">
      <rect width="260" height="32" rx="16" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" />
      <circle cx="16" cy="16" r="4" fill="#06b6d4" class="pulse-item" />
      <text x="30" y="20" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">
        HIGH-THROUGHPUT CONDUIT
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      AirLoom
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="200" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400">
      Zero-Cloud Frictionless File Transfer via Dynamic QR Codes
    </text>

    <!-- Core Spec Badges in Isometric Row -->
    <g transform="translate(0, 245)">
      <!-- Badge 1: 10GB Streaming -->
      <g transform="translate(0, 0)">
        <rect width="140" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
        <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">10 GB</text>
        <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Chunked Streams</text>
      </g>

      <!-- Badge 2: HTTP 206 Partial -->
      <g transform="translate(152, 0)">
        <rect width="140" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
        <text x="14" y="24" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">HTTP 206</text>
        <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Range Resumable</text>
      </g>

      <!-- Badge 3: Scrypt KDF -->
      <g transform="translate(304, 0)">
        <rect width="140" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
        <text x="14" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">Scrypt</text>
        <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Password Vault</text>
      </g>

      <!-- Badge 4: Instant QR -->
      <g transform="translate(456, 0)">
        <rect width="140" height="54" rx="10" fill="#0f172a" stroke="#1e293b" />
        <text x="14" y="24" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">High-Res</text>
        <text x="14" y="42" fill="#64748b" font-family="sans-serif" font-size="11">Offline QR Code</text>
      </g>
    </g>

    <!-- Terminal Prompt / Run Command -->
    <g transform="translate(0, 325)">
      <rect width="420" height="42" rx="8" fill="#020617" stroke="#334155" />
      <circle cx="16" cy="21" r="4" fill="#ef4444" />
      <circle cx="30" cy="21" r="4" fill="#eab308" />
      <circle cx="44" cy="21" r="4" fill="#22c55e" />
      <text x="64" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="13">$</text>
      <text x="80" y="26" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="13">git clone &amp;&amp; npm install &amp;&amp; npm run dev</text>
    </g>
  </g>

  <!-- Right Side: 3D Animated Isometric QR Cube & Conduit Matrix -->
  <g class="floating-cube">
    <!-- Orbital Rings -->
    <ellipse cx="920" cy="210" rx="160" ry="60" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4" class="spinning-ring streaming-line" />
    <ellipse cx="920" cy="210" rx="130" ry="48" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" class="spinning-ring-reverse streaming-line-fast" />

    <!-- 3D Isometric Cube Construction -->
    <!-- Top Face -->
    <polygon points="920,95 1030,155 920,215 810,155" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <!-- Top Face QR Matrix Elements -->
    <g opacity="0.85" stroke="#38bdf8" stroke-width="2">
      <!-- Top QR pattern -->
      <polygon points="920,115 970,142 920,170 870,142" fill="#06b6d4" fill-opacity="0.25" />
      <polygon points="920,128 945,142 920,156 895,142" fill="#38bdf8" />
      <!-- Grid lines on top face -->
      <line x1="860" y1="128" x2="970" y2="188" stroke-opacity="0.3" />
      <line x1="980" y1="128" x2="870" y2="188" stroke-opacity="0.3" />
    </g>

    <!-- Left Face -->
    <polygon points="810,155 920,215 920,335 810,275" fill="#090d16" stroke="#06b6d4" stroke-width="2" />
    <!-- Left Face Matrix & Details -->
    <g opacity="0.8">
      <line x1="845" y1="175" x2="845" y2="295" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="880" y1="195" x2="880" y2="315" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,4" />
      <!-- Left QR Finder block -->
      <polygon points="830,195 860,212 860,242 830,225" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="880" y="240" width="16" height="30" transform="skewY(27)" fill="#06b6d4" opacity="0.6" />
    </g>

    <!-- Right Face -->
    <polygon points="920,215 1030,155 1030,275 920,335" fill="#030712" stroke="#a855f7" stroke-width="2" />
    <!-- Right Face Circuit Elements -->
    <g opacity="0.85">
      <line x1="955" y1="195" x2="955" y2="315" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="995" y1="175" x2="995" y2="295" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4" />
      <!-- Right QR Finder block -->
      <polygon points="980,185 1010,168 1010,200 980,218" fill="#9333ea" stroke="#c084fc" stroke-width="1.5" />
      <rect x="940" y="235" width="16" height="32" transform="skewY(-27)" fill="#db2777" opacity="0.7" />
    </g>

    <!-- Inner Core Floating Crystal with AirLoom "A" -->
    <g transform="translate(920, 215)">
      <circle cx="0" cy="0" r="32" fill="#020617" stroke="#ec4899" stroke-width="2" filter="url(#subtleGlow)" />
      <polygon points="0,-18 16,12 -16,12" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <line x1="-9" y1="4" x2="9" y2="4" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Dynamic Glowing Vertices -->
    <circle cx="920" cy="95" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="1030" cy="155" r="4.5" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle cx="920" cy="215" r="5" fill="#ec4899" filter="url(#subtleGlow)" />
    <circle cx="810" cy="155" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="920" cy="335" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="1030" cy="275" r="4.5" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle cx="810" cy="275" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)" />

    <!-- Data Packets orbiting -->
    <rect x="880" y="80" width="8" height="8" rx="2" fill="#22d3ee" transform="rotate(45 884 84)" class="pulse-item" />
    <rect x="1050" y="210" width="8" height="8" rx="2" fill="#ec4899" transform="rotate(45 1054 214)" class="pulse-item" />
    <rect x="780" y="220" width="8" height="8" rx="2" fill="#a855f7" transform="rotate(45 784 224)" class="pulse-item" />
  </g>
</svg>
