<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1000" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .stream-wire {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.8s linear infinite;
      }
      .node-1 { animation: floatNode 4s ease-in-out infinite; }
      .node-2 { animation: floatNode 4s ease-in-out infinite 1s; }
      .node-3 { animation: floatNode 4s ease-in-out infinite 2s; }
      .node-4 { animation: floatNode 4s ease-in-out infinite 3s; }
      .pulse-bullet { animation: pulseLight 2s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1000" height="320" rx="14" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Animated Data Conduits connecting 4 nodes -->
  <path d="M 210,160 C 270,160 270,160 330,160" stroke="url(#streamGrad)" stroke-width="3" class="stream-wire" />
  <path d="M 450,160 C 510,160 510,160 570,160" stroke="url(#streamGrad)" stroke-width="3" class="stream-wire" />
  <path d="M 690,160 C 750,160 750,160 810,160" stroke="url(#streamGrad)" stroke-width="3" class="stream-wire" />

  <!-- Node 1: Browser file.slice() -->
  <g transform="translate(90, 80)" class="node-1">
    <rect width="140" height="160" rx="12" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="70" cy="45" r="22" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" filter="url(#nodeGlow)" />
    <!-- File Icon -->
    <path d="M 62,35 H 74 L 80,41 V 55 H 62 Z" fill="none" stroke="#22d3ee" stroke-width="2" />
    <text x="70" y="95" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. Slicing</text>
    <text x="70" y="115" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">5 MB Chunks</text>
    <text x="70" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Zero RAM Spike</text>
  </g>

  <!-- Node 2: Concurrent Node.js Stream -->
  <g transform="translate(330, 80)" class="node-2">
    <rect width="140" height="160" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="70" cy="45" r="22" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5" filter="url(#nodeGlow)" />
    <!-- Stream Pipes Icon -->
    <path d="M 58,40 H 82 M 58,45 H 82 M 58,50 H 82" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="70" y="95" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. Streaming</text>
    <text x="70" y="115" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">fs.createWriteStream</text>
    <text x="70" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Rolling SHA-256</text>
  </g>

  <!-- Node 3: Scrypt KDF & Atomic Store -->
  <g transform="translate(570, 80)" class="node-3">
    <rect width="140" height="160" rx="12" fill="#090d16" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="70" cy="45" r="22" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5" filter="url(#nodeGlow)" />
    <!-- Lock / Vault Icon -->
    <rect x="62" y="42" width="16" height="13" rx="2" stroke="#c084fc" stroke-width="2" />
    <path d="M 65,42 V 37 C 65,34 75,34 75,37 V 42" stroke="#c084fc" stroke-width="2" />
    <text x="70" y="95" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. Security</text>
    <text x="70" y="115" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Scrypt KDF Hash</text>
    <text x="70" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Atomic Token Vault</text>
  </g>

  <!-- Node 4: High-Res QR & Mobile HTTP 206 -->
  <g transform="translate(810, 80)" class="node-4">
    <rect width="140" height="160" rx="12" fill="#090d16" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="70" cy="45" r="22" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1.5" filter="url(#nodeGlow)" />
    <!-- QR Code Mini Icon -->
    <rect x="61" y="36" width="7" height="7" stroke="#f472b6" stroke-width="1.5" />
    <rect x="72" y="36" width="7" height="7" stroke="#f472b6" stroke-width="1.5" />
    <rect x="61" y="47" width="7" height="7" stroke="#f472b6" stroke-width="1.5" />
    <rect x="74" y="49" width="3" height="3" fill="#f472b6" />
    <text x="70" y="95" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">4. Delivery</text>
    <text x="70" y="115" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Instant QR Scan</text>
    <text x="70" y="130" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">HTTP 206 Partial Stream</text>
  </g>

  <!-- Header Text inside diagram -->
  <text x="50" y="42" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">
    AirLoom Streaming Architecture Pipeline
  </text>
  <text x="50" y="58" fill="#64748b" font-family="monospace" font-size="11">
    END-TO-END ZERO BUFFER OVERFLOW CONDUIT • 10 GB TESTED
  </text>
</svg>
